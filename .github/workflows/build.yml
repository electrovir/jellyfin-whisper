name: Build & Release

on:
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: ${{ steps.sha.outputs.short }}
          body: |
            Automated build from commit ${{ github.sha }}.
          make_latest: ${{ github.ref_name == github.event.repository.default_branch }}
          files: |
            Jellyfin.Plugin.Whisper/bin/Release/net8.0/Jellyfin.Plugin.Whisper.dll
