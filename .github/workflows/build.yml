name: Build & Release

on:
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Get timestamp
        id: timestamp
        run: echo "ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - name: Fetch all tags
        run: git fetch --tags

      - name: Get changelog since latest release
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ] && git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            LOG=$(git log "${LATEST_TAG}..HEAD" --pretty=format:'- %h %an: %s' --no-merges)
          else
            LOG=$(git log --pretty=format:'- %h %an: %s' --no-merges)
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "log<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.timestamp.outputs.ms }}
          name: ${{ steps.timestamp.outputs.ms }}
          body: |
            ## Changes since last release

            ${{ steps.changelog.outputs.log }}
          make_latest: ${{ github.ref_name == github.event.repository.default_branch }}
          files: |
            Jellyfin.Plugin.Whisper/bin/Release/net8.0/Jellyfin.Plugin.Whisper.dll
